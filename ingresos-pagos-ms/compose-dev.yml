name: ingresos-pagos-dev

services:
  postgres-ingresos-pagos-dev:
    image: postgres:16-alpine
    container_name: postgres-ingresos-pagos-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ingresos_pagos_db
      POSTGRES_USER: ingresospagos
      POSTGRES_PASSWORD: ingresospagos
    ports:
      - "15433:5432"
    volumes:
      - ingresos_pagos_dev_data:/var/lib/postgresql/data

volumes:
  ingresos_pagos_dev_data:
