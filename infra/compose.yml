name: infra-prod

services:
  config:
    build:
      context: ./config
      dockerfile: Dockerfile
    container_name: config
    restart: unless-stopped
    ports:
      - "28888:8888"
    volumes:
      - ./config/config-repo:/config-repo
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - prod-net

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: eureka
    restart: unless-stopped
    ports:
      - "28761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config:8888
    depends_on:
      config:
        condition: service_healthy
    networks:
      - prod-net

networks:
  prod-net:
    name: prod-net
