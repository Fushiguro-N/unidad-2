server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lms-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: lms-ms
          __path__: /var/log/lms-ms/*.log
  - job_name: ingresos-pagos-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: ingresos-pagos-ms
          __path__: /var/log/ingresos-pagos-ms/*.log
  - job_name: auth-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: auth-ms
          __path__: /var/log/auth-ms/*.log
  - job_name: hooa-keycloak
    static_configs:
      - targets: [localhost]
        labels:
          application: hooa-keycloak
          __path__: /var/log/hooa-keycloak/*.log
  - job_name: gateway
    static_configs:
      - targets: [localhost]
        labels:
          application: gateway
          __path__: /var/log/gateway/*.log
