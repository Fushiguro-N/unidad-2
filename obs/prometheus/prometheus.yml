global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "microservicios"
    eureka_sd_configs:
      - server: "http://eureka:8761/eureka"
    metrics_path: "/actuator/prometheus"
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application

  - job_name: "config"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["config:8888"]
        labels:
          application: config

  - job_name: "eureka"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["eureka:8761"]
        labels:
          application: eureka
