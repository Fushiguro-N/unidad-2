global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "microservicios"
    eureka_sd_configs:
      - server: "http://host.docker.internal:18761/eureka"
    metrics_path: "/actuator/prometheus"
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
      - source_labels: [__address__]
        regex: "localhost:(.+)"
        target_label: __address__
        replacement: "host.docker.internal:$1"

  - job_name: "config"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:18888"]
        labels:
          application: config

  - job_name: "eureka"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:18761"]
        labels:
          application: eureka
