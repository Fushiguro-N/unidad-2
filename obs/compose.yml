name: obs-prod

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - prod-net

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    ports:
      - "23100:3100"
    networks:
      - prod-net

  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../lms-ms/logs:/var/log/lms-ms:ro
      - ../ingresos-pagos-ms/logs:/var/log/ingresos-pagos-ms:ro
      - ../auth-ms/logs:/var/log/auth-ms:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - prod-net

networks:
  prod-net:
    external: true
