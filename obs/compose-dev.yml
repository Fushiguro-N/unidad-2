name: obs-dev

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus-dev
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.7.6
    container_name: loki-dev
    restart: unless-stopped
    ports:
      - "13100:3100"

  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail-dev
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config-dev.yml:/etc/promtail/config.yml:ro
      - ../lms-ms/logs:/var/log/lms-ms:ro
      - ../ingresos-pagos-ms/logs:/var/log/ingresos-pagos-ms:ro
      - ../auth-ms/logs:/var/log/auth-ms:ro
      - ../keycloak/logs:/var/log/hooa-keycloak:ro
      - ../infra/gateway/logs:/var/log/gateway:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana-dev
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
